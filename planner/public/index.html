<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiRISTA Work Plan</title>
<link rel="icon" href="assets/airista-logo.png">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-top">
<div class="top-row">
<div class="brand"><a href="https://www.airistaflow.com/" target="_blank" rel="noopener" aria-label="AiRISTA website"><img class="airista-logo" src="assets/airista-logo.png" alt="AiRISTA"></a><i aria-hidden="true"></i><a class="lg-logo" href="https://letsgrow.dev/" target="_blank" rel="noopener" aria-label="LetsGrow MarTech website"><img class="lg-light" src="assets/letsgrow-martech-logo-dark.png" alt="LetsGrow MarTech"><img class="lg-dark" src="assets/letsgrow-martech-logo.png" alt="" aria-hidden="true"></a><strong>Work Plan</strong></div>
<nav class="tabs" id="tabs">
<button type="button" data-view="focus">Priorities</button>
<button type="button" data-view="board">Board</button>
<button type="button" data-view="ws">Workstreams</button>
<button type="button" data-view="road">Roadmap</button>
<button type="button" data-view="checkin">Daily check-in</button>
<button type="button" data-view="reports">Reports</button>
</nav>
<div class="top-right"><span class="sync" id="sync">Loading</span><button class="ibtn notify-btn" id="notify" type="button" aria-label="Notifications" title="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="notify-count" hidden></span></button><button class="ibtn theme-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button><button class="who" id="who" type="button"></button></div>
</div>
</header>
<div class="bar"><div class="stats" id="stats"></div><button class="btn primary add-task-btn" id="add-task" type="button" aria-haspopup="dialog">+ Add task</button><div class="filters" id="filters">
<select id="f-type" aria-label="Type"></select>
<select id="f-ws" aria-label="Workstream"></select>
<select id="f-owner" aria-label="Owner"></select>
<select id="f-prio" aria-label="Priority"></select>
<input type="search" id="f-q" placeholder="Search deliverables" aria-label="Search">
</div></div>
<main id="main"></main>
<footer class="foot">
<span><b>Dates</b>Dates are proposed until agreed.</span>
<span><b>Completion</b>Mark work complete only with evidence of implementation, delivery or publication.</span>
<span class="r"><button class="btn sm" id="export" type="button">Export JSON backup</button></span>
</footer>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Deliverable details"></aside>
<div class="modal" id="modal" hidden></div>
<script src="js/core.js?v=20261014b"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js?v=20261014b"></script>
<script src="js/drawer.js?v=20261014b"></script>
<script src="js/reports.js"></script>
<script src="js/health.js"></script>
<script src="js/app.js?v=20261014b"></script>
</body>
</html>
