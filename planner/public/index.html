<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiRISTA Work Plan</title>
<link rel="icon" href="assets/airista-logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-top">
<div class="top-row">
<div class="brand"><img src="assets/airista-logo.png" alt="AiRISTA"><div><b>Work Plan</b><span>AiRISTA Flow · LetsGrow LLC</span></div></div>
<nav class="tabs" id="tabs">
<button type="button" data-view="focus">Priorities</button>
<button type="button" data-view="board">Board</button>
<button type="button" data-view="ws">Workstreams</button>
<button type="button" data-view="road">Roadmap</button>
<button type="button" data-view="checkin">Daily check-in</button>
</nav>
<div class="top-right"><span class="sync" id="sync">Loading</span><button class="who" id="who" type="button"></button></div>
</div>
</header>
<div class="bar"><div class="stats" id="stats"></div><div class="filters" id="filters">
<select id="f-type" aria-label="Type"></select>
<select id="f-ws" aria-label="Workstream"></select>
<select id="f-owner" aria-label="Owner"></select>
<select id="f-prio" aria-label="Priority"></select>
<input type="search" id="f-q" placeholder="Search deliverables" aria-label="Search">
</div></div>
<main id="main"></main>
<footer class="foot">
<span><b>Dates</b>Dates are proposed until agreed.</span>
<span><b>Completion</b>Mark work complete only with evidence of implementation, delivery or publication.</span>
<span class="r"><button class="btn sm" id="export" type="button">Export JSON backup</button></span>
</footer>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Deliverable details"></aside>
<div class="modal" id="modal" hidden></div>
<script src="js/core.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/drawer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
